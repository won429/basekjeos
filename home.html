<!-- home.html -->
<div class="w-full h-full flex flex-col items-center pt-8 pb-[100px] overflow-y-auto scrollbar-hide">
    
    <!-- 상단 헤더 -->
    <div class="w-[90%] max-w-[380px] flex justify-between items-center mb-4">
        <div class="flex flex-col">
            <h1 class="text-[22px] font-black text-white tracking-tight">오늘의 야구</h1>
            <span class="text-[12px] text-gray-400 font-medium">2026년 5월 17일 (일)</span>
        </div>
        <button class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-white active:scale-95 transition-transform">
            <i class="fa-regular fa-calendar-check text-[15px]"></i>
        </button>
    </div>

    <!-- 스코어보드 카드 (오늘의 메인 경기) -->
    <div class="w-[90%] max-w-[380px] bg-gradient-to-b from-[#1C1C1E] to-[#151515] rounded-[28px] border border-white/10 shadow-[0_10px_40px_rgba(0,0,0,0.5)] p-5 relative overflow-hidden">
        
        <!-- 상태 뱃지 -->
        <div class="flex justify-between items-center mb-5">
            <span class="bg-[#EA0029]/10 text-[#EA0029] border border-[#EA0029]/30 text-[10px] font-black px-2.5 py-1 rounded-md tracking-widest flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-[#EA0029] animate-pulse"></span>LIVE 5회초
            </span>
            <span class="text-[11px] text-gray-400 font-bold tracking-tight"><i class="fa-solid fa-location-dot mr-1 text-gray-500"></i>광주 챔피언스필드</span>
        </div>

        <!-- 점수 영역 -->
        <div class="flex justify-between items-center mb-6 px-2">
            <!-- 어웨이 팀 -->
            <div class="flex flex-col items-center w-[30%]">
                <div class="w-14 h-14 bg-white/5 rounded-full border border-white/10 flex items-center justify-center mb-2 shadow-inner">
                    <img src="https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/lgtwins.png" class="w-10 h-10 object-contain drop-shadow-md">
                </div>
                <span class="text-white font-black text-[16px]">LG</span>
                <span class="text-gray-500 text-[9px] font-bold tracking-widest mt-0.5">AWAY</span>
            </div>
            
            <!-- 중앙 스코어 -->
            <div class="w-[40%] flex flex-col items-center justify-center">
                <div class="flex items-center justify-center gap-3">
                    <span class="text-[40px] font-black text-white leading-none tracking-tighter">2</span>
                    <span class="text-lg text-gray-600 font-black mb-1">:</span>
                    <span class="text-[40px] font-black text-[#EA0029] leading-none tracking-tighter drop-shadow-[0_0_10px_rgba(234,0,41,0.5)]">5</span>
                </div>
                <!-- 볼카운트 표시 -->
                <div class="flex items-center gap-2 mt-2">
                    <div class="flex gap-0.5"><div class="w-1.5 h-1.5 rounded-full bg-green-500"></div><div class="w-1.5 h-1.5 rounded-full bg-gray-600"></div><div class="w-1.5 h-1.5 rounded-full bg-gray-600"></div></div>
                    <div class="flex gap-0.5"><div class="w-1.5 h-1.5 rounded-full bg-yellow-400"></div><div class="w-1.5 h-1.5 rounded-full bg-yellow-400"></div></div>
                    <div class="flex gap-0.5"><div class="w-1.5 h-1.5 rounded-full bg-red-500"></div><div class="w-1.5 h-1.5 rounded-full bg-gray-600"></div></div>
                </div>
            </div>
            
            <!-- 홈 팀 -->
            <div class="flex flex-col items-center w-[30%]">
                <div class="w-14 h-14 bg-white/5 rounded-full border border-white/10 flex items-center justify-center mb-2 shadow-inner">
                    <img src="https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/kia_logoo.png" class="w-10 h-10 object-contain drop-shadow-md">
                </div>
                <span class="text-white font-black text-[16px]">KIA</span>
                <span class="text-[#EA0029] text-[9px] font-bold tracking-widest mt-0.5">HOME</span>
            </div>
        </div>

        <!-- 라인업 보기 버튼 -->
        <button onclick="document.getElementById('lineup-modal').classList.remove('hidden')" class="w-full py-3.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-2xl text-[13px] font-bold text-white transition-all active:scale-[0.98] shadow-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-list-ul text-gray-400"></i> 양 팀 라인업 확인
        </button>
    </div>

    <!-- 주간 일정 리스트 -->
    <div class="w-[90%] max-w-[380px] mt-8 flex flex-col gap-3">
        <div class="flex justify-between items-end mb-1">
            <h2 class="text-[16px] font-bold text-white">이번 주 일정</h2>
            <button class="text-[11px] font-bold text-gray-400 bg-white/5 px-3 py-1 rounded-full border border-white/10 active:scale-95">전체 일정 보기</button>
        </div>

        <!-- 지난 경기 (종료) -->
        <div class="bg-[#1C1C1E]/60 rounded-2xl p-4 border border-white/5 flex justify-between items-center opacity-70">
            <div class="flex flex-col gap-1.5">
                <span class="text-[10px] text-gray-400 font-bold tracking-tight">5. 16 (토) 17:00</span>
                <div class="flex items-center gap-2.5">
                    <span class="text-white font-black text-[14px]">삼성 <span class="text-gray-500 font-medium ml-1">4</span></span>
                    <span class="text-[10px] text-gray-600 font-bold">vs</span>
                    <span class="text-point font-black text-[14px]"><span class="text-gray-500 font-medium mr-1">7</span> KIA</span>
                </div>
            </div>
            <span class="bg-gray-700/50 border border-gray-600/50 text-gray-300 text-[10px] font-bold px-2 py-1 rounded-md">경기종료</span>
        </div>
        
        <!-- 예정된 경기 (경기전) -->
        <div class="bg-[#1C1C1E]/80 rounded-2xl p-4 border border-white/5 flex justify-between items-center active:scale-[0.98] transition-transform cursor-pointer">
            <div class="flex flex-col gap-1.5">
                <span class="text-[10px] text-[#074CA1] font-bold tracking-tight">5. 18 (월) 18:30</span>
                <div class="flex items-center gap-2.5">
                    <span class="text-white font-black text-[14px]">KIA</span>
                    <span class="text-[10px] text-gray-500 font-bold">vs</span>
                    <span class="text-white font-black text-[14px]">삼성</span>
                </div>
            </div>
            <span class="bg-blue-600/20 text-blue-400 border border-blue-600/30 text-[10px] font-bold px-2 py-1 rounded-md">예정</span>
        </div>
    </div>

    <!-- 라인업 모달 팝업 (초기 숨김 상태) -->
    <div id="lineup-modal" class="hidden fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex items-end justify-center transition-opacity">
        <div class="bg-[#151515] w-full max-w-[430px] h-[85vh] rounded-t-[32px] border-t border-white/10 flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
            
            <!-- 팝업 헤더 -->
            <div class="flex justify-between items-center px-6 py-5 border-b border-white/5">
                <h2 class="text-[16px] font-black text-white tracking-tight">LG vs KIA 라인업</h2>
                <button onclick="document.getElementById('lineup-modal').classList.add('hidden')" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-gray-400 active:scale-95 transition-transform"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <!-- 팝업 내용 -->
            <div class="flex-1 overflow-y-auto px-6 py-5 scrollbar-hide flex gap-4">
                
                <!-- AWAY 라인업 -->
                <div class="w-1/2 flex flex-col">
                    <div class="flex items-center gap-2 mb-4">
                        <img src="https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/lgtwins.png" class="w-6 h-6 object-contain">
                        <span class="text-[13px] font-bold text-gray-300">LG 선발</span>
                    </div>
                    <div class="flex flex-col gap-3">
                        <div class="flex justify-between text-[12px]"><span class="text-white font-bold"><span class="text-gray-500 mr-1.5 text-[10px]">1</span>홍창기</span><span class="text-gray-500 text-[10px]">우익</span></div>
                        <div class="flex justify-between text-[12px]"><span class="text-white font-bold"><span class="text-gray-500 mr-1.5 text-[10px]">2</span>문성주</span><span class="text-gray-500 text-[10px]">좌익</span></div>
                        <div class="flex justify-between text-[12px]"><span class="text-white font-bold"><span class="text-gray-500 mr-1.5 text-[10px]">3</span>김현수</span><span class="text-gray-500 text-[10px]">지명</span></div>
                        <div class="flex justify-between text-[12px]"><span class="text-white font-bold"><span class="text-gray-500 mr-1.5 text-[10px]">4</span>오스틴</span><span class="text-gray-500 text-[10px]">1루</span></div>
                        <div class="flex justify-between text-[12px]"><span class="text-white font-bold"><span class="text-gray-500 mr-1.5 text-[10px]">5</span>문보경</span><span class="text-gray-500 text-[10px]">3루</span></div>
                        <div class="w-full h-px bg-white/10 my-1"></div>
                        <div class="flex justify-between text-[12px]"><span class="text-white font-bold"><span class="text-blue-400 font-black mr-1.5 text-[10px]">P</span>엔스</span><span class="text-gray-500 text-[10px]">투수</span></div>
                    </div>
                </div>

                <div class="w-px bg-white/5 shrink-0"></div>

                <!-- HOME 라인업 -->
                <div class="w-1/2 flex flex-col">
                    <div class="flex items-center gap-2 mb-4">
                        <img src="https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/kia_logoo.png" class="w-6 h-6 object-contain">
                        <span class="text-[13px] font-bold text-gray-300">KIA 선발</span>
                    </div>
                    <div class="flex flex-col gap-3">
                        <div class="flex justify-between text-[12px]"><span class="text-white font-bold"><span class="text-gray-500 mr-1.5 text-[10px]">1</span>박찬호</span><span class="text-gray-500 text-[10px]">유격</span></div>
                        <div class="flex justify-between text-[12px]"><span class="text-white font-bold"><span class="text-gray-500 mr-1.5 text-[10px]">2</span>김도영</span><span class="text-gray-500 text-[10px]">3루</span></div>
                        <div class="flex justify-between text-[12px]"><span class="text-white font-bold"><span class="text-gray-500 mr-1.5 text-[10px]">3</span>나성범</span><span class="text-gray-500 text-[10px]">우익</span></div>
                        <div class="flex justify-between text-[12px]"><span class="text-white font-bold"><span class="text-gray-500 mr-1.5 text-[10px]">4</span>최형우</span><span class="text-gray-500 text-[10px]">지명</span></div>
                        <div class="flex justify-between text-[12px]"><span class="text-white font-bold"><span class="text-gray-500 mr-1.5 text-[10px]">5</span>소크라테스</span><span class="text-gray-500 text-[10px]">중견</span></div>
                        <div class="w-full h-px bg-white/10 my-1"></div>
                        <div class="flex justify-between text-[12px]"><span class="text-white font-bold"><span class="text-red-400 font-black mr-1.5 text-[10px]">P</span>네일</span><span class="text-gray-500 text-[10px]">투수</span></div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
